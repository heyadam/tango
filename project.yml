name: Tango
options:
  bundleIdPrefix: com.heyadam.tango
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  TangoKit:
    path: .
targets:
  Tango:
    type: application
    platform: macOS
    sources:
      - App
      - path: Icon/Tango.icon   # the app icon, made in Icon Composer: the system rounds and lights it
        type: file
        buildPhase: resources
    dependencies:
      - package: TangoKit
        product: PaperEditor
    info:
      path: App/Info.plist
      properties:
        CFBundleName: tango
        CFBundleDisplayName: tango
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHighResolutionCapable: true
        NSCameraUsageDescription: A prototype you are running shows the camera or takes a photo.
        NSMicrophoneUsageDescription: A prototype you are running reacts to how loud it is, or listens to what you say.
        NSLocationWhenInUseUsageDescription: A prototype you are running uses your location.
        CFBundleDocumentTypes:
          - CFBundleTypeName: tango Prototype
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - com.tango.document
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.tango.extension
            UTTypeDescription: tango Extension
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - paperextension
          - UTTypeIdentifier: com.tango.document
            UTTypeDescription: tango Prototype
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - tango
        NSLocalNetworkUsageDescription: tango sends the prototype you are making to the tango app on a paired iPhone nearby.
        NSBonjourServices: [_tango._tcp]
    entitlements:
      path: App/Tango.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyadam.tango
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: Tango
        ASSETCATALOG_COMPILER_APPICON_NAME: Tango
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES   # notarization requires it (scripts/release.sh)
  # The iOS player: an @main around PaperPlayer, as App/ is around PaperEditor.
  TangoPlayer:
    type: application
    platform: iOS
    sources:
      - path: Player
        excludes: ["*.xcconfig"]
      - path: Icon/Tango.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: TangoKit
        product: PaperPlayer
    configFiles:
      Debug: Player/Signing.xcconfig
      Release: Player/Signing.xcconfig
    info:
      path: Player/Info.plist
      properties:
        CFBundleName: tango
        CFBundleDisplayName: tango
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Prototypes run at the display's full rate.
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: tango looks for your Mac nearby to play the prototypes you make on it.
        NSBonjourServices: [_tango._tcp]
        NSCameraUsageDescription: tango uses the camera to scan the code your Mac shows, which pairs the two.
        # A .tango package, which the Mac app exports, opened from Files or AirDrop.
        CFBundleDocumentTypes:
          - CFBundleTypeName: tango Prototype
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.tango.document]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.tango.document
            UTTypeDescription: tango Prototype
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [tango]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_NAME: TangoPlayer
        ASSETCATALOG_COMPILER_APPICON_NAME: Tango
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
